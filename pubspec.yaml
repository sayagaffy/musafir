name: musafir
description: "musafir project for dev."
publish_to: "none"

version: 0.1.0

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  persistent_bottom_nav_bar_v2: ^5.0.0
  image_picker: ^0.8.4+4
  google_maps_flutter: ^2.5.3
  http: ^1.2.0
  device_preview: ^1.1.0
  get: ^4.6.6
  shared_preferences: ^2.2.2
  omni_datetime_picker: ^1.0.9
  geocoding: ^3.0.0
  geolocator: ^10.0.1
  geolocator_apple: 2.1.1+1
  skeletonizer: ^1.0.1
  flutter_rating_bar: ^4.0.1
  firebase_core: ^2.31.0
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.1.1
  flutter_launcher_icons: "^0.13.1"
  dropdown_search: ^5.0.6
  dio: ^5.5.0+1
  map_launcher: ^3.5.0
  flutter_datetime_picker: ^1.5.1
  flutter_svg: ^2.0.17
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1
  firebase_crashlytics: ^3.4.18
  fl_chart: ^0.66.2 # Added for pie charts

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brandBlue.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/brandBlue.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/brandBlue.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/brandBlue.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
